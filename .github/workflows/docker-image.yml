# Đóng gói ảnh Docker (amd64 + arm64) và đăng lên GitHub Container Registry mỗi khi mã mới vào nhánh main.
# Máy chủ Synology/Linux chỉ cần tải lại ảnh để cập nhật. Hướng dẫn: docs/TRIEN_KHAI_SYNOLOGY.md
name: Ảnh Docker (Synology / Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/eemc-workmanager-web

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build và đăng ảnh
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=2.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
